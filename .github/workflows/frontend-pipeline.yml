name: CD Frontend Deployment

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        # Agregamos front_despacho/ al contexto para que encuentre el Dockerfile
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest -f front_despacho/Dockerfile front_despacho/
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest

    - name: Deploy to Frontend EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.FRONTEND_PUBLIC_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          docker stop front_despacho_app || true
          docker rm front_despacho_app || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest
          docker run -d --name front_despacho_app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest