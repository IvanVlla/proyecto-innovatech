name: CD Frontend Public Deployment

on:
  push:
    branches:
      - deploy
    paths:
      - 'front_despacho/**'
      - '.github/workflows/frontend-pipeline.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build and Push Docker Image with Build Args
      run: |
        docker build \
          --build-arg VITE_API_BASE_URL_VENTAS=http://3.237.179.74:8081 \
          --build-arg VITE_API_BASE_URL_DESPACHOS=http://3.237.179.74:8082 \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest ./front_despacho
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest

    - name: Deploy via SSH to Public EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.FRONTEND_PUBLIC_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo docker stop innovatech-front || true
          sudo docker rm innovatech-front || true
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest
          sudo docker run -d \
            --name innovatech-front \
            --restart always \
            -p 80:8080 \
            ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest