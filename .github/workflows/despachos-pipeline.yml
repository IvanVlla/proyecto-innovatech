name: CD Despachos Private Deployment

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Despachos_SpringBoot/**'
      - '.github/workflows/despachos-pipeline.yml'
      - 'docker-compose.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub (Native)
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

    - name: Deploy via SSH ProxyJump
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.FRONTEND_PUBLIC_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        sync: true
        script: |
          # 1. Crear el directorio en la máquina Backend (10.0.142.7) pasando por el Front
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa ec2-user@10.0.142.7 "mkdir -p ~/innovatech"

          # 2. Escribir el archivo docker-compose.yml en la máquina Backend apuntando a la Data (10.0.155.105)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa ec2-user@10.0.142.7 << 'EOF'
            cat << 'COMPOSE' > ~/innovatech/docker-compose.yml
          version: '3.8'

          services:
            back-ventas:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest
              container_name: innovatech-back-ventas
              restart: always
              ports:
                - "8081:8081"
              environment:
                - SERVER_PORT=8081
                - SPRING_DATASOURCE_URL=jdbc:postgresql://10.0.155.105:5432/db_innovatech
                - SPRING_DATASOURCE_USERNAME=root
                - SPRING_DATASOURCE_PASSWORD=rootpassword
              volumes:
                - ventas-logs:/app/logs
              networks:
                - innovatech-net

            back-despachos:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
              container_name: innovatech-back-despachos
              restart: always
              ports:
                - "8082:8082"
              environment:
                - SERVER_PORT=8082
                - SPRING_DATASOURCE_URL=jdbc:postgresql://10.0.155.105:5432/db_innovatech
                - SPRING_DATASOURCE_USERNAME=root
                - SPRING_DATASOURCE_PASSWORD=rootpassword
              volumes:
                - despachos-logs:/app/logs
              networks:
                - innovatech-net

          volumes:
            ventas-logs:
            despachos-logs:

          networks:
            innovatech-net:
              driver: bridge
          COMPOSE

            # 3. Desplegar el servicio correspondiente en el Backend
            cd ~/innovatech
            sudo docker compose pull back-despachos
            sudo docker compose up -d back-despachos
          EOF