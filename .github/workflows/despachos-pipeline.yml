name: CD Despachos Private Deployment

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        # Apuntamos a la ruta exacta del backend de Despachos
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest -f back-Despachos_SpringBoot/Springboot-API-REST/Dockerfile back-Despachos_SpringBoot/Springboot-API-REST/
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

    - name: Deploy via SSH ProxyJump
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: 10.0.128.158
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }}
        proxy_username: ec2-user
        proxy_key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          cd ~/app-backend
          docker stop back_despachos || true
          docker rm back_despachos || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
          docker run -d \
            --name back_despachos \
            -p 8082:8082 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.0.128.66:5432/db_ventas_despachos \
            -e SPRING_DATASOURCE_USERNAME=user_innovatech \
            -e SPRING_DATASOURCE_PASSWORD=password_secure_123 \
            ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest