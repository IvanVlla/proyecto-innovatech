name: CD Ventas Private Deployment

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Ventas_SpringBoot/**'
      - '.github/workflows/ventas-pipeline.yml'
      - 'docker-compose.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub (Native)
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

    - name: Deploy via SSH ProxyJump
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.FRONTEND_PUBLIC_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # 1. Crear el directorio en la máquina privada pasando por el Front
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@10.0.128.158 "mkdir -p ~/innovatech"

          # 2. Escribir el archivo docker-compose.yml directamente en la máquina privada
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@10.0.128.158 << 'EOF'
            cat << 'COMPOSE' > ~/innovatech/docker-compose.yml
          version: '3.8'

          services:
            back-ventas:
              image: ${DOCKERHUB_USERNAME}/back-ventas:latest
              container_name: innovatech-back-ventas
              restart: always
              ports:
                - "8081:8081"
              environment:
                - SERVER_PORT=8081
                - SPRING_DATASOURCE_URL=jdbc:mysql://10.0.128.66:3306/db_innovatech?allowPublicKeyRetrieval=true&useSSL=false
                - SPRING_DATASOURCE_USERNAME=root
                - SPRING_DATASOURCE_PASSWORD=rootpassword
              volumes:
                - ventas-logs:/app/logs
              networks:
                - innovatech-net

            back-despachos:
              image: ${DOCKERHUB_USERNAME}/back-despachos:latest
              container_name: innovatech-back-despachos
              restart: always
              ports:
                - "8082:8082"
              environment:
                - SERVER_PORT=8082
                - SPRING_DATASOURCE_URL=jdbc:mysql://10.0.128.66:3306/db_innovatech?allowPublicKeyRetrieval=true&useSSL=false
                - SPRING_DATASOURCE_USERNAME=root
                - SPRING_DATASOURCE_PASSWORD=rootpassword
              volumes:
                - despachos-logs:/app/logs
              networks:
                - innovatech-net

          volumes:
            ventas-logs:
            despachos-logs:

          networks:
            innovatech-net:
              driver: bridge
          COMPOSE

            # 3. Desplegar el servicio correspondiente
            cd ~/innovatech
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" sudo -E docker compose pull back-ventas
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" sudo -E docker compose up -d back-ventas
          EOF